function breakdown(){const p=price(),first=p.base+p.ex,hourly=state.pricingMode==='hourly';const lines=hourly?`<div class="quote-line"><span><b>Hourly cleaning</b><small>${state.hours} hours × ${state.cleaners} cleaner${Number(state.cleaners)>1?'s':''} · $55/hour per cleaner · ${conditionLabel()}</small></span><strong>${money(first)}</strong></div>`:`<div class="quote-line"><span><b>${state.service==='deep'?'Deep cleaning':state.service==='move'?'Move-in / move-out cleaning':'Standard cleaning'}</b><small>${state.beds} bedrooms · ${state.baths} bathrooms · ${conditionLabel()}</small></span><strong>${money(p.base)}</strong></div><div class="quote-line"><span><b>Selected extras</b><small>${state.extras.length?state.extras.map(x=>EXTRAS.find(e=>e.id===x)?.name||x).join(' · '):'No extras selected'}</small></span><strong>${p.ex?money(p.ex):'Included'}</strong></div>`;return `<section class="quote-redesign" aria-label="Your cleaning price"><div class="quote-top"><div><span class="quote-kicker">YOUR PERSONALIZED ESTIMATE</span><h3>Here's your breakdown.</h3><p>Everything in one place, with no guesswork.</p></div><span class="quote-symbol">✦</span></div><div class="quote-lines">${lines}</div>${!hourly&&state.frequency!=='once'?`<div class="quote-repeat"><span>↻ <b>15% off future visits</b><small>Your first clean remains full price</small></span><strong>${money(p.total)} <small>/ visit</small></strong></div>`:''}<div class="quote-bottom"><span>✓ No surprise add-ons without approval</span><span>✓ 200% satisfaction guarantee</span></div></section>`}
function slots(){let opts=['8–10 AM','10 AM–12 PM','12–2 PM','2–4 PM'];return `<div class="slot-grid">${opts.map((x,i)=>`<button class="slot ${state.slot===x?'active':''}" onclick="setSlot('${x}')"><b>${x}</b><small>${i===0?'Early arrival':'2-hour arrival window'} · Demo</small></button>`).join('')}</div><div class="slot-note">These are example windows, not live availability. Selecting a window does not reserve it.</div>`}
function setSlot(x){state.slot=x;render()}
function dateISO(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function chosenDate(){if(state.customDate){let [y,m,d]=state.customDate.split('-').map(Number);return new Date(y,m-1,d)}let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+Number(state.date)+1);return d}
function formattedDate(){return chosenDate().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function selectQuickDate(i){state.date=i;state.customDate='';render()}
function chooseCalendarDate(v){if(!v)return;let [y,m,d]=v.split('-').map(Number);let chosen=new Date(y,m-1,d);let min=new Date();min.setHours(0,0,0,0);min.setDate(min.getDate()+1);if(chosen<min){alert('Please choose a future date.');return}state.customDate=v;render()}
function openCalendar(){state.calendarOpen=!state.calendarOpen;let d=chosenDate();if(state.calendarMonth===null)state.calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCalendarOnly()}
function moveCalendar(delta){let m=state.calendarMonth||new Date();state.calendarMonth=new Date(m.getFullYear(),m.getMonth()+delta,1);renderCalendarOnly()}
function pickCalendarDay(iso){chooseCalendarDate(iso);state.calendarOpen=false;render()}
function calendarHTML(){let today=new Date();today.setHours(0,0,0,0);let min=new Date(today);min.setDate(min.getDate()+1);let month=state.calendarMonth||new Date(chosenDate().getFullYear(),chosenDate().getMonth(),1);let first=new Date(month.getFullYear(),month.getMonth(),1);let start=first.getDay();let total=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let cells=Array.from({length:start},()=>'<span class="cal-day blank"></span>');for(let day=1;day<=total;day++){let d=new Date(month.getFullYear(),month.getMonth(),day),iso=dateISO(d),past=d<min,sel=dateISO(chosenDate())===iso;cells.push(`<button type="button" class="cal-day ${sel?'selected':''}" ${past?'disabled':''} ${sel?'aria-current="date"':''} onclick="pickCalendarDay('${iso}')">${day}</button>`)}let canBack=new Date(month.getFullYear(),month.getMonth()+1,0)>=min;return `<div class="cal-panel" role="group" aria-label="Choose cleaning date"><div class="cal-top"><span class="cal-month">${month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span><div class="cal-arrows"><button class="cal-arrow" aria-label="Previous month" ${canBack?'':'disabled'} onclick="moveCalendar(-1)">‹</button><button class="cal-arrow" aria-label="Next month" onclick="moveCalendar(1)">›</button></div></div><div class="cal-week">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-days">${cells.join('')}</div><div class="cal-bottom"><span>Choose your preferred cleaning date</span><button onclick="pickCalendarDay('${dateISO(min)}')">Earliest date</button></div></div>`}
function renderCalendarOnly(){let host=document.getElementById('calendar-panel-host'),trigger=document.getElementById('calendar-toggle');if(!host)return;host.innerHTML=state.calendarOpen?calendarHTML():'';if(trigger)trigger.setAttribute('aria-expanded',String(state.calendarOpen))}

function saveDemo(){try{let data={...state,photos:[]};localStorage.setItem('snapclean-demo',JSON.stringify(data));alert('Your selections are saved in this browser. No message was sent.');}catch(e){alert('Unable to save in this browser.')}}
function restoreDemo(){try{let data=JSON.parse(localStorage.getItem('snapclean-demo')||'null');if(!data){alert('No saved demo found in this browser.');return}Object.assign(state,data,{photos:[]});render()}catch(e){alert('Unable to restore saved selections.')}}
function paymentChoices(){const options=[['card','Card on file · pay after service','Securely save your card now. You’re charged after the cleaning. Link may appear for faster checkout.'],['applepay','Apple Pay','Pay securely with Apple Pay on a compatible Apple device and browser.'],['cashapp','Pay with Cash App','Pay now to secure your booking.']];return options.map(([id,title,desc])=>`<div class="pay-option ${state.payment===id?'active':''}" role="radio" aria-checked="${state.payment===id}" tabindex="0" onclick="choosePayment('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();choosePayment('${id}')}"><div class="pay-option-head"><span class="pay-radio"></span><span class="pay-title">${title}</span></div><div class="pay-desc">${desc}</div>${state.payment===id?`<div class="pay-detail">${id==='card'?`<div class="secure-card-preview">▣ &nbsp; Secure card entry <span>Card / Link</span></div><div class="payment-note">A live Stripe Payment Element will securely collect your card and may offer Link. No card data is entered in this prototype.</div>`:id==='applepay'?`<div class="secure-card-preview"><span class="apple-pay-symbol">● Pay</span><span>Apple Pay checkout</span></div><div class="payment-note">In production, Apple Pay will open the Apple payment sheet on supported devices. Payment is completed when you authorize it.</div>`:id==='cashapp'?`<div style="display:flex;align-items:center;gap:10px"><span class="cashapp-logo">$</span><b>Cash App checkout</b></div><div class="payment-note">A verified Cash App payment is required to secure the booking.</div>`:`<div class="secure-card-preview">✦ &nbsp; Continue with Link agent wallet <span>Approval required</span></div><div class="payment-note">Link's agent wallet is distinct from standard Link checkout. Availability for this merchant-operated, after-service payment flow must be confirmed before launch.</div>`}</div>`:''}</div>`).join('')}
function choosePayment(method){
  if(state.payment===method)return;
  state.payment=method;
  const optionsHost=document.querySelector('.payment-options');
  if(optionsHost){
    // Update only the payment choices; do not re-render the entire page or reset scroll.
    optionsHost.innerHTML=paymentChoices();
    const dock=document.querySelector('.checkout-dock');
    if(dock){
      const note=dock.querySelector('.quiet');
      const button=dock.querySelector('button.btn');
      if(note)note.textContent=method==='card'?'Card charged after service':method==='applepay'?'Apple Pay payment to secure booking':method==='cashapp'?'Cash App payment to secure booking':'Link agent-wallet approval';
      if(button)button.textContent=method==='applepay'?'Continue with Apple Pay →':method==='cashapp'?'Continue with Cash App →':method==='virtual'?'Continue with Link →':'Continue to secure card setup →';
    }
  }
}

function render(preserveScroll=false){const oldScroll=window.scrollY;nav();let p=price(),s='';if(state.step===0){s=`<div class="eyebrow">Book with confidence</div><h2>Let's get your home cleaned.</h2><p class="lead">Choose how you'd like to book your cleaning. You'll see the estimate after you tell us what you need.</p><div class="field"><label>How would you like to book?</label><div class="options">${option('pricingMode','home','By bedrooms & bathrooms','A cleaning price based on the size of your home')}${option('pricingMode','hourly','By the hour','Choose how many cleaners and how many hours')}</div></div>${state.pricingMode==='home'?`<div class="counter-grid">${counter('beds','Bedrooms',0,12)}${counter('baths','Bathrooms',1,12)}</div>`:`<div class="counter-grid">${counter('cleaners','# of maids',1,4)}${counter('hours','# of hours',2,8)}</div><div class="notice">Hourly cleaning is billed per cleaner per hour. You can review the estimate before booking.</div>`}<div class="optional-photo"><div><b>Want to share photos?</b><small>Completely optional. You can book without uploading anything.</small></div><button class="btn secondary" onclick="$('file').click()">${state.photos.length?'✓ '+state.photos.length+' added':'＋ Add photos'}</button></div><div class="microproof"><span>✓ 200% satisfaction guarantee</span><span>✓ Insured cleaning teams</span></div><div class="actions">${btn('Continue →','next()')}</div><div class="under-cta powered-by">Powered by Baseboard</div>`}if(state.step===1){s=`<div class="eyebrow">Personalize your clean</div><h2>Tell us what matters most.</h2><p class="lead">${state.pricingMode==='hourly'?'Help your cleaners prioritize their time.':'Help us recommend the right cleaning level.'} Your ${state.pricingMode==='hourly'?`${state.hours}-hour visit with ${state.cleaners} cleaner${Number(state.cleaners)>1?'s':''}`:`${state.beds}-bedroom, ${state.baths}-bathroom home`} is already saved.</p>${state.photos.length?`<img class="photoPreview" src="${state.photos[0]}" alt="Uploaded room">`:''}<div class="field"><label>How would you describe the overall condition?</label><div class="options">${option('condition','normal','Light / normal','Routine dusting, wiping and floors')}${option('condition','moderate','Moderately messy','Extra clutter or buildup')}${option('condition','heavy','Heavy cleaning needed','Significant dirt or buildup')}${option('condition','restoration','Full reset / restoration','Severe buildup or a long-unattended home — may need a full-day team reset')}</div></div>${state.pricingMode==='hourly'?`<div class="insight"><span class="glyph">✦</span><div><b>${state.condition==='restoration'?'A full-day team may be needed':"We'll prioritize your cleaning goals"}</b><p>${state.condition==='restoration'?'This review estimate includes a restoration allowance. Select enough cleaner-hours for a full-day reset; final scope is confirmed before a real booking.':'Your selected hours and number of cleaners determine your hourly estimate. Tell the team what matters most during the visit.'}</p></div></div>`:`<div class="insight"><span class="glyph">✦</span><div><b>${recommendation()[0]}</b><p>${recommendation()[1]}</p></div></div>`}<details class="helpdetails"><summary>What does the cleaning include?</summary><p>Standard cleaning covers routine surfaces, bathrooms and floors. Deep cleaning adds more detailed attention to buildup and neglected areas. Move-in / move-out cleaning is for an empty home before or after a move. Full reset / restoration is for severe buildup or a long-unattended home and may need an all-day team plan. Hourly cleaning is limited to the booked time and agreed priorities.</p></details>${proof()}${actions('Continue to my quote →')}`}if(state.step===2){s=`<div class="eyebrow">Transparent pricing · no obligation</div><h2>Let's make it spotless.</h2><p class="lead">Customize your cleaning. Your estimated total updates instantly.</p><div class="estimate"><div><small>YOUR ESTIMATED CLEANING PRICE</small><div><strong>${money(p.total)}</strong></div><small>${state.pricingMode==='hourly'?'Hourly visit · '+state.hours+' hours · '+state.cleaners+' cleaners':state.frequency==='once'?'One-time cleaning': 'First visit: '+money(p.base+p.ex)+' · future visits: '+money(p.total)}</small></div><span style="font-size:35px">✦</span></div>${state.pricingMode==='hourly'?`<div class="notice">Your hourly estimate is based on ${state.hours} hours and ${state.cleaners} cleaner${Number(state.cleaners)>1?'s':''}. No room-size charges are added.</div>`:`<div class="field"><label>Cleaning level</label><div class="options">${option('service','standard','Standard cleaning','Routine upkeep, floors, counters and bathrooms')}${option('service','deep','Deep cleaning','More detailed attention to buildup and surfaces')}${option('service','move','Move-in / move-out cleaning','For an empty home before move-in or after move-out')}</div></div>${extrasPicker()}<div class="field"><label>How often?</label><div class="options">${option('frequency','once','Just this once','One-time cleaning')}${option('frequency','weekly','Every week','Save 15% on future visits · first clean full price')}${option('frequency','biweekly','Every two weeks','Save 15% on future visits · first clean full price')}</div></div>`}${breakdown()}<p class="quote-footnote">Estimates shown are illustrative. Final service scope and pricing are confirmed before a real booking.</p>${actions('Choose my cleaning time →')}`;}if(state.step===3){let now=new Date();let dates=Array.from({length:4},(_,i)=>{let d=new Date(now);d.setDate(now.getDate()+i+1);return d});s=`<div class="eyebrow">Almost there</div><h2>Pick a day that works.</h2><p class="lead">Choose a preferred day and arrival window. We’ll confirm the appointment before it’s booked.</p><div class="field"><label>Preferred cleaning day</label><div class="dates">${dates.map((d,i)=>`<div class="date ${!state.customDate&&state.date===i?'selected':''}" onclick="selectQuickDate(${i})"><small ':state.service==='deep'?'Deep cleaning':state.service==='move'?'Move-in / move-out cleaning':'Standard cleaning'}</strong></div></div><button class="ticket-edit" type="button" onclick="state.step=3;render()">Edit booking ↗</button></div><div class="ticket-info"><div class="ticket-detail"><span class="ticket-detail-icon">▦</span><div><small>DATE & ARRIVAL</small><b>${formattedDate()}</b><span>${escapeHtml(state.slot)}</span></div></div><div class="ticket-detail"><span class="ticket-detail-icon">⌂</span><div><small>SERVICE DETAILS</small><b>${state.pricingMode==='hourly'?`${state.hours} hours · ${state.cleaners} cleaner${Number(state.cleaners)>1?'s':''}`:`${state.beds} bedroom${Number(state.beds)!==1?'s':''} · ${state.baths} bathroom${Number(state.baths)!==1?'s':''}`}</b><span>${state.pricingMode==='hourly'?'Hourly visit':state.frequency==='once'?'One-time cleaning':state.frequency==='weekly'?'Weekly cleaning':'Every two weeks'} · ${conditionLabel()}</span></div></div></div><div class="ticket-total"><div><small>FIRST CLEANING ESTIMATE</small><strong>${money(p.base+p.ex)}</strong></div><span>Clear pricing, no surprises</span></div></div><div class="checkout-contact-heading"><h3>Where should we send your confirmation?</h3><p>We'll use these details to coordinate your cleaning.</p></div><div class="fields"><div class="field"><label>Full name</label><input placeholder="Alex Morgan" value="${escapeHtml(state.name)}" oninput="state.name=this.value"></div><div class="field"><label>Phone</label><input placeholder="(555) 123-4567" value="${escapeHtml(state.phone)}" oninput="state.phone=this.value"></div></div><div class="field"><label>Email</label><input type="email" placeholder="you@example.com" value="${escapeHtml(state.email)}" oninput="state.email=this.value"></div><div class="payment-section-heading"><div class="eyebrow">Secure checkout</div><h3>Payment</h3><p>Choose how you’d like to pay for your cleaning.</p></div>${paymentBrandCard()}<div class="payment-selection-title">How would you like to secure your booking?</div><div class="payment-options">${paymentChoices()}</div><div class="trustgrid"><div><b>✓ 200% satisfaction guarantee</b>We stand behind the cleaning service.</div><div><b>✓ Insured cleaning teams</b>Professional service with added peace of mind.</div></div>${proof('checkout')}<div class="checkout-dock"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>First cleaning · ${money(p.base+p.ex)}</b><div class="quiet">${state.payment==='card'?'Card charged after service':state.payment==='applepay'?'Apple Pay payment to secure booking':state.payment==='cashapp'?'Cash App payment to secure booking':'Link agent-wallet approval'}</div></div><span class="tag">Review & confirm</span></div><button class="btn" onclick="finish()">${state.payment==='applepay'?'Continue with Apple Pay →':state.payment==='cashapp'?'Continue with Cash App →':state.payment==='virtual'?'Continue with Link →':'Continue to secure card setup →'}</button></div><button class="btn secondary" onclick="prev()">← Back to schedule</button><details class="helpdetails"><summary>When would I be charged?</summary><p>With pay-after-service, your card is securely collected at booking and charged once the cleaning is completed. Cash App and Apple Pay require payment to secure the booking. The Link agent-wallet option requires a supported, approved payment flow.</p></details>`;}if(state.step===5){s=tipPage()}if(state.step===6){s=`<section class="thankyou-page"><div class="celebrate-art" aria-hidden="true"><span>✦</span><span>✳</span><span>✦</span><span>✧</span><div class="thankyou-check">✓</div></div><div class="eyebrow">YOU'RE ALL SET</div><h2>Let the clean begin<span style="color:#D95B49">.</span></h2><p class="lead" style="max-width:520px;margin:12px auto 25px">A fresh home is on the horizon. Here's everything you need to know about your cleaning.</p><div class="thankyou-recap"><div><small>YOUR CLEANING</small><strong>${state.pricingMode==='hourly'?'Hourly cleaning':state.service==='deep'?'Deep cleaning':state.service==='move'?'Move-in / move-out cleaning':'Standard cleaning'}</strong><span>${state.pricingMode==='hourly'?`${state.hours} hours · ${state.cleaners} cleaner(s)`:`${state.beds} bedrooms · ${state.baths} bathrooms`} · ${conditionLabel()}</span></div><div><small>YOUR PREFERRED ARRIVAL</small><strong>${formattedDate()}</strong><span>${escapeHtml(state.slot)}</span></div><div><small>ESTIMATED TOTAL</small><strong>${money(p.base+p.ex)}</strong><span>${state.payment==='card'?'Card after service':state.payment==='applepay'?'Apple Pay':'Cash App'} · Tip ${money(tipAmount())}</span></div></div><div class="thankyou-next"><div class="thankyou-section-heading"><span class="eyebrow">THE GOOD PART</span><h3>What happens next?</h3></div><div class="next-steps"><div class="next-step"><span class="next-icon">✉</span><div><b>1. Confirmation details</b><p>You'll receive your appointment information once the booking and payment setup are completed.</p></div></div><div class="next-step"><span class="next-icon">▦</span><div><b>2. Get your home ready</b><p>Put away valuables and clear access to the areas you'd like cleaned. We'll bring the cleaning supplies.</p></div></div><div class="next-step"><span class="next-icon">✧</span><div><b>3. We'll take it from here</b><p>Your cleaning team arrives within the confirmed arrival window and gets to work.</p></div></div></div></div><div class="thankyou-notes"><div class="thankyou-section-heading"><span class="eyebrow">ONE LAST THING</span><h3>Anything we should know?</h3><p>Entry instructions, parking tips, pets, or areas you'd like us to focus on.</p></div><label for="after-notes" class="visually-hidden">Notes for your cleaning team</label><textarea id="after-notes" rows="4" maxlength="1200" placeholder="e.g. Please use the side entrance. Our dog is friendly, but we'll keep him in the bedroom." oninput="state.postBookingNotes=this.value;state.notesSaved=false;document.getElementById('notes-feedback').textContent=''">${escapeHtml(state.postBookingNotes)}</textarea><div class="notes-actions"><span id="notes-feedback" role="status">${state.notesSaved?'Notes saved on this device.':''}</span><button class="btn" type="button" onclick="savePostBookingNotes()">Save my notes →</button></div></div><p class="prototype-disclaimer">Prototype preview: no appointment or payment has been processed. Notes are saved on this device only, not sent to a cleaning team.</p><button class="btn secondary" type="button" onclick="reset()">Start another booking ↗</button></section>`} $('screen').innerHTML=s;if(preserveScroll)window.scrollTo(0,oldScroll);else window.scrollTo({top:0,behavior:'smooth'});}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function set(k,v){state[k]=v;if(k==='pricingMode'&&v==='hourly'){state.frequency='once';state.extras=[]}render()}function toggle(x){state.extras=state.extras.includes(x)?state.extras.filter(y=>y!==x):[...state.extras,x];render(true)}function next(){state.step=Math.min(state.step+1,6);render()}function prev(){state.step=Math.max(state.step-1,0);render()}function tipAmount(){const base=price().base+price().ex;return state.tipMode==='custom'?Math.max(0,Number(state.tipCustom)||0):Math.round(base*state.tipPercent/100)}

function tipPage(){const base=price().base+price().ex;const options=[[10,'A little thank-you','A kind gesture','♡'],[15,'Thanks so much','A thoughtful extra','✿'],[20,'You’re amazing','Show some extra love','✦'],[25,'Above & beyond','For exceptional care','★'],[30,'Made my day','A generous thank-you','♥']];return `<section class="tip-v2"><div class="tip-confirmed"><span class="tip-confirmed-icon">✓</span><div><strong>Your booking is confirmed!</strong><span>${formattedDate()} · ${escapeHtml(state.slot)} · ${state.pricingMode==='hourly'?'Hourly cleaning':state.service==='deep'?'Deep cleaning':state.service==='move'?'Move-in / move-out cleaning':'Standard cleaning'}</span></div><span class="tip-confirmed-label">ALL SET</span></div><div class="tip-v2-hero"><div class="tip-v2-copy"><div class="tip-v2-eyebrow">ONE OPTIONAL FINISHING TOUCH <span>♥</span></div><h2>A little love goes <em>a long way.</em></h2><p>Early mornings, traffic, tricky parking, street closures, and carrying supplies — your cleaning team handles a lot before they even knock. If you'd like to show your appreciation, they'll be grateful.</p><div class="tip-v2-note">Tipping is completely optional. Your cleaning is already booked.</div></div><div class="tip-v2-art" aria-hidden="true"><span class="tip-v2-orbit orbit1">✦</span><span class="tip-v2-orbit orbit2">✧</span><div class="tip-v2-heart">♥</div><span class="tip-v2-orbit orbit3">✦</span></div></div><div class="tip-v2-title"><div><span class="eyebrow">SAY IT YOUR WAY</span><h3>Choose your thank-you</h3></div><span class="tip-v2-subtitle">Calculated from your ${money(base)} cleaning</span></div><div class="tip-v2-grid">${options.map(([pct,title,desc,symbol])=>`<button type="button" class="tip-v2-choice ${state.tipMode==='percent'&&state.tipPercent===pct?'selected':''}" aria-pressed="${state.tipMode==='percent'&&state.tipPercent===pct}" onclick="chooseTip(${pct})"><span class="tip-v2-symbol">${symbol}</span><span class="tip-v2-percent">${pct}%</span><span class="tip-v2-dollars">${money(Math.round(base*pct/100))}</span><strong>${title}</strong><small>${desc}</small><span class="tip-v2-check">✓</span></button>`).join('')}</div><div class="tip-v2-custom"><div><strong>Have another amount in mind?</strong><span>Give exactly what feels right.</span></div><label class="tip-v2-input"><span>$</span><input id="custom-tip" type="number" min="0" step="1" placeholder="Custom amount" aria-label="Custom tip amount" value="${state.tipMode==='custom'?escapeHtml(state.tipCustom):''}" oninput="customTip(this.value)"></label></div><div class="tip-v2-bottom"><div class="tip-v2-summary"><div><span>Cleaning estimate</span><strong>${money(base)}</strong></div><div><span>Optional tip</span><strong id="tip-line">${money(tipAmount())}</strong></div><div class="tip-v2-total"><span>Estimated total</span><strong id="tip-total">${money(base+tipAmount())}</strong></div><small>Tip timing and collection depend on your payment method. No tip is charged in this prototype.</small></div><div class="tip-v2-cta"><button class="btn" type="button" onclick="state.step=6;render()">${tipAmount()>0?'Add my thank-you →':'Continue to my booking →'}</button><button class="tip-v2-skip" type="button" onclick="state.tipMode='percent';state.tipPercent=0;state.tipCustom='';state.step=6;render()">No tip, thanks — I'm all set</button><span>♥ Your team appreciates the thought either way.</span></div></div></section>`}
function finish(){if(!state.name.trim()||!state.email.includes('@')||!state.phone.trim() ){alert('Please enter your name, email, and phone.');return}state.step=5;render()}function savePostBookingNotes(){try{localStorage.setItem('snapclean_post_booking_notes',state.postBookingNotes);state.notesSaved=true;document.getElementById('notes-feedback').textContent='✓ Notes saved on this device';}catch(e){document.getElementById('notes-feedback').textContent='Could not save notes on this device.'}}function reset(){location.reload()}$('file').addEventListener('change',e=>{const files=Array.from(e.target.files).slice(0,5);if(!files.length)return;Promise.all(files.map(f=>new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>resolve(null);reader.readAsDataURL(f)}))).then(images=>{state.photos=images.filter(Boolean);render()})});render();const bookingTimerStarted=Date.now();
function updateBookingClock(){const elapsed=Math.floor((Date.now()-bookingTimerStarted)/1000);const left=Math.max(0,600-elapsed);const el=$('booking-clock');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');}
updateBookingClock();setInterval(updateBookingClock,1000);
</script></body></html>
