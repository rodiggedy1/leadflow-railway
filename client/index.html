<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <script>
      // Startup recovery. If one of our own bundles under /assets/ fails to load (for example a page
      // from before a deploy asks for a file that no longer exists, or a download fails), React never
      // starts and the page would stay white. Once the page has settled with nothing rendered, show a
      // loading spinner and keep fetching a fresh copy of the page on a growing delay (immediately, then
      // 2s, 5s, 10s, then every 30s) until it opens. There is no button and no fast loop. The attempt
      // number travels in the URL (lf_retry) so the delay keeps growing across reloads without browser
      // storage, and it is removed again once the page has opened.
      // ErrorBoundary calls window.__leadflowRetryLoad when a route chunk fails after React started.
      // Inline and plain ES5 on purpose: it has to run even when every bundle fails.
      (function () {
        var PARAM = "lf_retry";
        var DELAYS = [0, 2000, 5000, 10000, 30000];
        var PHONE_HINT_FROM = 2;
        var scheduled = false;
        var watching = false;

        function attempt() {
          try {
            return Math.max(0, parseInt(new URL(location.href).searchParams.get(PARAM), 10) || 0);
          } catch (e) {
            return 0;
          }
        }

        function isOwnAsset(url) {
          try {
            var parsed = new URL(url, location.href);
            return parsed.origin === location.origin && parsed.pathname.indexOf("/assets/") === 0;
          } catch (e) {
            return false;
          }
        }

        function appRendered() {
          var root = document.getElementById("root");
          return !!(root && root.hasChildNodes());
        }

        function showLoading(n) {
          var root = document.getElementById("root") || document.body;
          root.innerHTML =
            "<style>@keyframes lf-spin{to{transform:rotate(360deg)}}</style>" +
            "<div style='min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center'>" +
            "<div role='status' aria-label='Loading' style='width:32px;height:32px;box-sizing:border-box;border:4px solid #E8735A;border-top-color:transparent;border-radius:50%;animation:lf-spin .8s linear infinite'></div>" +
            (n >= PHONE_HINT_FROM
              ? "<p style='margin:0;font-size:14px;line-height:1.5;color:#666'>Still loading. You can also book by phone: <a href='tel:+12028885362' style='color:#111'>202-888-5362</a></p>"
              : "") +
            "</div>";
        }

        // Fetch a fresh copy of the page after the delay for this attempt. fromApp: React is running
        // and shows its own spinner, so the page content is left alone.
        function retry(fromApp) {
          if (scheduled) return;
          scheduled = true;
          var n = attempt();
          if (!fromApp) showLoading(n);
          setTimeout(function () {
            try {
              var url = new URL(location.href);
              url.searchParams.set(PARAM, String(n + 1));
              location.replace(url.href);
            } catch (e) {
              location.reload();
            }
          }, DELAYS[Math.min(n, DELAYS.length - 1)]);
        }

        window.__leadflowRetryLoad = function () {
          retry(true);
        };

        // After a retry, drop the marker once the page has opened and stayed up for 10 seconds.
        function forgetAttemptsOnceOpen() {
          var root = document.getElementById("root");
          if (!root || typeof MutationObserver === "undefined") return;
          var timer = null;
          var check = function () {
            if (timer || !root.hasChildNodes()) return;
            timer = setTimeout(function () {
              if (scheduled) return;
              try {
                var url = new URL(location.href);
                url.searchParams.delete(PARAM);
                history.replaceState(history.state, "", url.href);
              } catch (e) {}
            }, 10000);
          };
          new MutationObserver(check).observe(root, { childList: true });
          check();
        }
        if (attempt() > 0) {
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", forgetAttemptsOnceOpen);
          else forgetAttemptsOnceOpen();
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (watching || !target || (target.tagName !== "SCRIPT" && target.tagName !== "LINK")) return;
            if (!isOwnAsset(target.src || target.href)) return;
            watching = true;
            var settle = function () {
              setTimeout(function () {
                watching = false;
                if (!appRendered()) retry(false);
              }, 1000);
            };
            if (document.readyState === "complete") settle();
            else window.addEventListener("load", settle);
          },
          true
        );
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LeadFlow Quote Form</title>
